# Rebuild the pacman repository from each project's newest release (sources.txt)
# and publish it on GitHub Pages: https://<owner>.github.io/arch-repo/<arch>/.
#
# Nothing is rebuilt: the packages come from the projects' GitHub Releases, are
# checked against their release keys, re-signed with the repository key
# (ARCH_REPO_GPG_KEY) and indexed with repo-add.
#
# Triggers:
#   - workflow_dispatch: a project's release workflow (or a manual run).
#   - pushes to main: e.g. adding a project in sources.txt.
name: publish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Newest releases
        run: |
          set -euo pipefail
          scripts/state.sh > state.txt
          { echo '```'; cat state.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Download the packages
        run: scripts/collect.sh state.txt collected

      - name: Sign and index (archlinux container)
        env:
          ARCH_REPO_GPG_KEY: ${{ secrets.ARCH_REPO_GPG_KEY }}
        run: |
          docker run --rm -e ARCH_REPO_GPG_KEY \
            -v "$GITHUB_WORKSPACE:/src" -w /src archlinux:latest \
            scripts/build-repo.sh collected site
          sudo chown -R "$(id -u):$(id -g)" site
          cp state.txt site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
